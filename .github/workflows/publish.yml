---
# Publish to PyPI and npm when Bitbucket CI pushes a new release commit.
# Bitbucket handles validation (lint, type-check, tests, security scans).
# This workflow only runs the publish step.
name: Publish

on:
  push:
    branches: [main]

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # PIP_CONSTRAINT also applies inside build's isolated environment, so the
      # setuptools backend comes from requirements.lock (at least two weeks old).
      - name: Install build tools
        run: pip install -c requirements.lock build

      - name: Build package
        run: python -m build
        env:
          PIP_CONSTRAINT: requirements.lock

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1.
      # Node 22 ships with npm 10.x, so upgrade before publishing. Pinned (not
      # @latest) so the release never runs an npm published in the last two weeks.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@12.2.1

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --provenance || echo "Version may already exist"

  publish-ghcr:
    name: Publish Docker image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract version
        id: version
        run: echo "version=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/imagin-studio/api-docs-mcp:${{ steps.version.outputs.version }}
            ghcr.io/imagin-studio/api-docs-mcp:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
